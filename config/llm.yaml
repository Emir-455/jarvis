llm:
  backend: "llama_cpp"
  model_path: ""  # Set to GGUF model path, e.g.: data/models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
  # Ollama integration (easiest way to get interactive AI):
  # 1. Install Ollama: https://ollama.com
  # 2. Run: ollama pull llama3.1
  # 3. Uncomment below:
  ollama_url: ""    # e.g.: http://localhost:11434
  ollama_model: ""  # e.g.: llama3.1
  n_ctx: 4096
  n_gpu_layers: 35        # Offload to RTX 4060 8GB VRAM
  n_threads: 12           # 6C/12T Ryzen 5 7600X
  n_batch: 1024
  temperature: 0.6
  top_p: 0.9
  repeat_penalty: 1.1
  max_tokens: 256          # Short for voice responses
  use_mmap: true           # Memory-map model for efficient RAM
  use_mlock: false
  seed: -1
  stop_tokens:
    - "</s>"
    - "[/INST]"
